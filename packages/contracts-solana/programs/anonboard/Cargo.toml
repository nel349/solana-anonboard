[package]
name = "anonboard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Solana post program backing the anonboard example"
resolver = "2"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "1.18.26"

[package.metadata.solana]
program-id = "8veT8XVnBxG6kmq27CrCgznCtVHLJsBAqGHZrodKaRJ6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true
